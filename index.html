<body class="landing">

    <header class="landing-head">
      <svg class="vista" viewBox="0 0 640 250" aria-hidden="true">
        <g class="vista-ink">
          <!-- the Great Wood along the right edge -->

          <path class="wood" d="M506 170 q2 -14 16 -14 q6 -12 18 -6 q12 -6 16 6 q12 2 10 14"/>
          <path class="hatch" d="M486 200 l-4 8 M496 196 l-4 9 M506 200 l-4 8 M552 206 l-4 8 M562 204 l-4 9 M574 208 l-4 7 M590 210 l-3 7 M520 168 l-3 7 M532 166 l-3 7"/>

          <g class="hut" transform="translate(196 186)"><path d="M-14 0 Q0 -24 14 0 Z"/><path d="M-10 0 v7 h20 v-7"/><path class="hatch" d="M-6 -3 l3 -9 M0 -3 l0 -12 M6 -3 l-3 -9"/></g>

          <g class="hut" transform="translate(362 176) scale(.9)"><path d="M-14 0 Q0 -24 14 0 Z"/><path d="M-10 0 v7 h20 v-7"/><path class="hatch" d="M-6 -3 l3 -9 M0 -3 l0 -12 M6 -3 l-3 -9"/></g>
          <g class="hut" transform="translate(402 187)"><path d="M-14 0 Q0 -24 14 0 Z"/><path d="M-10 0 v7 h20 v-7"/><path class="hatch" d="M-6 -3 l3 -9 M0 -3 l0 -12 M6 -3 l-3 -9"/></g>

      <p class="eyebrow">Stonetop</p>
      <h1>Akmeņgals</h1>
      <svg class="ornament-rule" viewBox="0 0 400 14" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path d="M10 7 H178 M222 7 H390" stroke="currentColor" stroke-width="1.2"/>
        <path d="M184 7 l8 -6 l8 6 l-8 6 z M200 7 l8 -6 l8 6 l-8 6 z" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="200" cy="7" r="1.8" fill="currentColor"/>
        <circle cx="10" cy="7" r="2" fill="currentColor"/><circle cx="390" cy="7" r="2" fill="currentColor"/>
      </svg>
    </header>

    <nav class="choices" aria-label="Lapas">
      <a class="choice" href="karte.html">
        <svg class="choice-art" viewBox="0 0 240 130" aria-hidden="true">
          <g class="art-links">
            <path d="M120 34 Q96 60 74 88"/><path d="M120 34 Q144 60 166 88"/>
            <path d="M74 92 Q120 106 166 92" class="tension"/>
            <path d="M74 88 L28 64"/><path d="M74 88 L40 118"/><path d="M166 88 L212 62"/><path d="M166 88 L206 116" class="love"/>
            <path d="M120 34 L70 16"/><path d="M120 34 L176 14"/>
          </g>
          <g class="art-minor">
            <circle cx="28" cy="64" r="8"/><circle cx="40" cy="118" r="7"/><circle cx="212" cy="62" r="8"/>
            <circle cx="206" cy="116" r="7"/><circle cx="70" cy="16" r="7"/><circle cx="176" cy="14" r="7"/>
          </g>
          <g class="art-major" id="art-pcs"></g>
        </svg>
        <span class="choice-title">Attiecību karte</span>
        <span class="choice-text">Kas ir kas Akmeņgalā un kā viņus saista asinis, solījumi un nesaskaņas</span>
        <span class="choice-go" aria-hidden="true">Atvērt karti →</span>
      </a>

      <a class="choice" href="hronika.html">
        <svg class="choice-art" viewBox="0 0 240 130" aria-hidden="true">
          <g class="art-stick">
            <path class="stick" d="M10 74 Q120 64 230 74 L230 96 Q120 86 10 96 Z"/>
            <path class="notches" d="M30 70 v26 M44 69 v26 M70 68 v26 M84 68 v26 M120 67 v26 M146 67 v26 M158 67 v26 M190 68 v26 M200 68 v26 M214 69 v26"/>
            <path class="bark" d="M18 84 h6 M98 81 h12 M168 81 h10"/>
          </g>
          <g id="art-events"></g>
        </svg>
        <span class="choice-title">Hronika</span>
        <span class="choice-text">Notikumi no senām dienām līdz šodienai, iegriezti kā robi koka nūjā</span>
        <span class="choice-go" aria-hidden="true">Lasīt hroniku →</span>
      </a>
    </nav>
  </main>

  <script src="assets/js/glyphs.js"></script>
  <script>
    // Drop a few of the shared ink emblems into the two illustrations.
    (function () {
      var g = STONETOP.glyphMarkup;
      var pcs = [['sapling', 120, 34], ['shield', 74, 90], ['whisk', 166, 90]];
      document.getElementById('art-pcs').innerHTML = pcs.map(function (p) {
        return '<circle cx="' + p[1] + '" cy="' + p[2] + '" r="17"/>' + g(p[0], p[1], p[2], 22);
      }).join('');
      var ev = [['moon', 30, 32], ['wolf', 77, 30], ['claws', 120, 28], ['sapling', 163, 30], ['sun', 210, 32]];
      document.getElementById('art-events').innerHTML = ev.map(function (e) {
        return '<path class="tie" d="M' + e[1] + ' ' + (e[2] + 17) + ' V' + (e[2] + 37) + '"/>' + g(e[0], e[1], e[2], 30);
      }).join('');
    })();
  </script>
</body>
